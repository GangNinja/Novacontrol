name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q

  docs-sync:
    name: API reference in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Check docs/API.md is generated from ROUTE_CONSUMERS
        run: python scripts/generate_api_reference.py --check
        env:
          PYTHONIOENCODING: utf-8

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"
      # Both platform views, so Windows-only ctypes/winreg code in hardware.py
      # (and anything like it) is checked even though the runner is Linux:
      # typeshed declares those attributes Windows-only, so a Linux-only check
      # lets Windows-view regressions through and a Windows-only check does the
      # reverse. The default run is the linux view (native to the runner).
      - name: Run mypy (linux view)
        run: python -m mypy src
      - name: Run mypy (windows view)
        run: python -m mypy src --platform win32
